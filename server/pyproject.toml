[project]
name = "rhapsode"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "google-genai",
    "python-dotenv",
    "chromadb",
    "sentence-transformers",
    "httpx",
    "json-repair",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["rhapsode*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
