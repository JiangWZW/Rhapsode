# Session eval pipeline defaults. CLI flags override these values.
#
# Logging: run.py spawns uvicorn by default and tees server stdout into
# <out_dir>/console.log, plus llm_profile.jsonl for per-hop timings.
# Use CLI --attach only when reusing an external server (no console capture).

[player]
protocol = "protocol.md"
guide = "guides/merge_fork_test.md"
empty_action = "I look around carefully."

[run]
turns = 3
host = "127.0.0.1"
port = "8080"
ws_path = "/ws"
turn_timeout_s = 1800
open_timeout_s = 120
saves_dir = ""   # empty = <repo>/server/saves
