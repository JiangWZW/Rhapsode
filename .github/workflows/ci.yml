name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python and build tools
        shell: pwsh
        run: |
          python -m venv server/.venv
          server/.venv/Scripts/python -m pip install --upgrade pip
          server/.venv/Scripts/python -m pip install -e "server[dev]" ninja

      - name: Configure and build C++ tests
        shell: pwsh
        run: |
          cmake --preset default
          cmake --build --preset default-tests

      - name: Run C++ tests
        run: ctest --preset default

      - name: Run Python checks
        shell: pwsh
        run: |
          server/.venv/Scripts/python -m compileall -q server/rhapsode server/tests
          server/.venv/Scripts/python -m pytest -q server/tests
          server/.venv/Scripts/python -m ruff check server/rhapsode server/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend checks
        shell: pwsh
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run lint
          npm --prefix frontend run build
